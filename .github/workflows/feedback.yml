# Folds portal Keep/Skip issues into feedback.yml, replies, and closes them.
#
# Issue text is untrusted. It never reaches a shell: the event is read by gitforage
# from $GITHUB_EVENT_PATH, open issues are fetched as JSON into a file, and the only
# values passed through env are the repo name and numbers. gitforage accepts only a
# title of exactly `keep: owner/name` or `skip: owner/name` and never echoes it back.
name: feedback

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions: {}

# One feedback run at a time. GitHub keeps only one pending run per group, so in a
# burst of issues some runs are dropped; each run therefore handles every open
# feedback issue, not only the one that triggered it.
concurrency:
  group: gitforage-feedback
  cancel-in-progress: false

env:
  GITFORAGE_REPO: iacsha/gitforage
  GITFORAGE_SHA: "486f6a84b4b2ba56a94b61648b52ed2eed03070a"

jobs:
  feedback:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'gitforage-feedback') ||
      startsWith(github.event.issue.title, 'keep:') ||
      startsWith(github.event.issue.title, 'skip:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out gitforage at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITFORAGE_REPO }}
          ref: ${{ env.GITFORAGE_SHA }}
          path: .gitforage-src
          persist-credentials: false

      - name: Refuse an unpinned gitforage
        run: |
          if ! printf '%s' "$GITFORAGE_SHA" | grep -Eq '^[0-9a-f]{40}$' || [ "$GITFORAGE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Set GITFORAGE_SHA to a real gitforage commit (see README)."
            exit 1
          fi
          test "$(git -C .gitforage-src rev-parse HEAD)" = "$GITFORAGE_SHA"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install gitforage from its lockfile
        working-directory: .gitforage-src
        run: bun install --frozen-lockfile --production --ignore-scripts

      - name: List open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100&sort=created&direction=asc" > "$RUNNER_TEMP/issues.json"

      - name: Fold feedback into feedback.yml
        env:
          # Used to look up account ages (public data). Sent only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bun .gitforage-src/packages/cli/src/cli.ts feedback --config interests.yml
          --event "$GITHUB_EVENT_PATH" --issues "$RUNNER_TEMP/issues.json" --replies "$RUNNER_TEMP/replies"

      - name: Commit feedback.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback.yml
          if git diff --cached --quiet; then
            echo "No new marks."
            exit 0
          fi
          git commit -m "gitforage: feedback"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          for _ in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            git -c "http.https://github.com/.extraheader=$auth" pull --rebase origin "$BRANCH"
          done
          exit 1

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/replies/*.md; do
            n="$(basename "$f" .md)"
            case "$n" in (*[!0-9]*|'') continue ;; esac
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$f"
            gh issue close "$n" --repo "$GITHUB_REPOSITORY"
          done
