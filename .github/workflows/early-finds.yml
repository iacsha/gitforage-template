# Daily: update state/early-finds.json, the live record behind the Found early page.
# It reads state/seen.json, checks GitHub Trending, the Hacker News front page and
# star counts, and commits only the ledger. With early_finds.enabled off in
# interests.yml, gitforage does nothing and there is nothing to commit. The page is
# rebuilt by the weekly forage run.
name: early-finds

on:
  schedule:
    - cron: "41 7 * * *" # daily, 07:41 UTC
  workflow_dispatch:

permissions: {}

# One update at a time. Its own group, so it never cancels or waits on a forage or
# feedback run; each rebases before it pushes.
concurrency:
  group: gitforage-early-finds
  cancel-in-progress: false

env:
  # The gitforage commit this portal runs. Pinned by full SHA so a run is reproducible
  # and nothing changes under you; update it on purpose to upgrade.
  GITFORAGE_REPO: iacsha/gitforage
  GITFORAGE_SHA: "486f6a84b4b2ba56a94b61648b52ed2eed03070a"

jobs:
  early-finds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out gitforage at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITFORAGE_REPO }}
          ref: ${{ env.GITFORAGE_SHA }}
          path: .gitforage-src
          persist-credentials: false

      - name: Refuse an unpinned gitforage
        run: |
          if ! printf '%s' "$GITFORAGE_SHA" | grep -Eq '^[0-9a-f]{40}$' || [ "$GITFORAGE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Set GITFORAGE_SHA to a real gitforage commit (see README)."
            exit 1
          fi
          test "$(git -C .gitforage-src rev-parse HEAD)" = "$GITFORAGE_SHA"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install gitforage from its lockfile
        working-directory: .gitforage-src
        run: bun install --frozen-lockfile --production --ignore-scripts

      - name: Update the early-finds ledger
        env:
          # Read-only use: public repo data. Sent only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .gitforage-src/packages/cli/src/cli.ts early-finds --config interests.yml

      - name: Commit the ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f state/early-finds.json ]; then
            echo "No early-finds ledger (early_finds is off, or nothing shown yet)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/early-finds.json
          if git diff --cached --quiet; then
            echo "No ledger changes."
            exit 0
          fi
          git commit -m "gitforage: early finds of $(date -u +%Y-%m-%d)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          for _ in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            git -c "http.https://github.com/.extraheader=$auth" pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
